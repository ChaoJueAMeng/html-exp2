name: restore-homework-images
on:
  push:
    paths:
      - '.github/workflows/restore-homework-images.yml'
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download and commit homework JPEGs
        run: |
          set -euo pipefail
          curl -fsSL -o image-ex-2-1-tianxia.jpg https://litter.catbox.moe/hk1clm.jpg
          curl -fsSL -o image-ex-2-2-tiananmen.jpg https://litter.catbox.moe/4ddu8j.jpg
          echo "cbf52a4c5a5a5da367fb13a98a37bb7f  image-ex-2-1-tianxia.jpg" | md5sum -c
          echo "302a05a396eb556f7ea849725baebbb8  image-ex-2-2-tiananmen.jpg" | md5sum -c
          git config user.name "JUN CAI"
          git config user.email "344369755@student.gdufe.edu.cn"
          git add image-ex-2-1-tianxia.jpg image-ex-2-2-tiananmen.jpg
          git rm -f .github/workflows/restore-homework-images.yml
          git commit -m "补充实验2作业配图"
          git push
